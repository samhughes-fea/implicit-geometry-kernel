[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "implicit-geometry-kernel"
dynamic = ["version"]
description = "Implicit (signed-distance) geometry of blade and wing sections: 40 structural layouts, wall midlines and cell loops, lofted along the span."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Hughes" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.22", "shapely>=2.0", "numba>=0.59"]
keywords = ["wind turbine blade", "wing", "cross-section", "signed distance function", "CSG", "geometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
splines = ["scipy>=1.8"]
plots = ["matplotlib>=3.5"]
dev = ["scipy>=1.8", "matplotlib>=3.5", "pytest>=7", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/samhughes-fea/implicit-geometry-kernel"
Source = "https://github.com/samhughes-fea/implicit-geometry-kernel"
Issues = "https://github.com/samhughes-fea/implicit-geometry-kernel/issues"

[tool.setuptools.dynamic]
version = { attr = "implicit_geometry_kernel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]

[tool.pytest.ini_options]
# the forked subpackages keep their own tests and examples beside their code, in
# folders that share names (tests/, examples/), so modules are imported by path
addopts = "--import-mode=importlib"
testpaths = ["tests", "src/implicit_geometry_kernel"]
markers = ["frame_comparison: coordinate-frame convention checks from the forked geometry"]
