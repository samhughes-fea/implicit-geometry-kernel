name: tool-drift

# Weekly lint and typecheck with the newest ruff and mypy. The tests workflow pins
# them in [dev]; this job shows when a new release would break main, without
# blocking pull requests.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  latest-tools:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GEOS
        # libgeos_c from the Shapely wheel on PyPI: no apt mirror in the path.
        # Shapely is used only to fetch the library; the kernel never imports it.
        run: |
          python -m pip install "shapely==2.2.0"
          python -c "import glob, os, shapely; d = os.path.join(os.path.dirname(shapely.__file__), os.pardir, 'shapely.libs'); print('GEOS_LIBRARY_PATH=' + os.path.abspath(sorted(glob.glob(os.path.join(d, 'libgeos_c*')))[0]))" >> "$GITHUB_ENV"
      - name: Install package with the newest tools
        run: |
          pip install -e ".[dev]"
          pip install -U ruff mypy numpy
      - name: Lint
        run: ruff check src tests examples scripts
      - name: Typecheck
        run: mypy src/implicit_geometry_kernel
