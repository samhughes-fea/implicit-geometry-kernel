name: release

# On a version tag: the tag must match __version__, then build the sdist and
# wheel. Publishing to PyPI runs only when the repository variable
# PYPI_PUBLISH is "true" and a PyPI trusted publisher is set up for this
# repository and workflow (environment "pypi"); until then nothing is uploaded.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches __version__
        run: |
          version=$(python -c "import ast, pathlib; tree = ast.parse(pathlib.Path('src/implicit_geometry_kernel/__init__.py').read_text()); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and any(getattr(t, 'id', '') == '__version__' for t in n.targets)))")
          echo "tag ${GITHUB_REF_NAME}, __version__ ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
