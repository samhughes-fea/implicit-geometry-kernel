name: release

# On a version tag: the tag must match __version__, then build the sdist and
# wheel. Publishing to PyPI runs only when the repository variable
# PYPI_PUBLISH is "true" and a PyPI trusted publisher is set up for this
# repository and workflow (environment "pypi"); until then nothing is uploaded.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Tag rules: docs/conventions/RELEASING.md
      - name: Tag is a release name
        run: |
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v0\.9\.[0-9]+(rc[0-9]+)?$' || { echo "::error::${GITHUB_REF_NAME} is not a release tag (v0.9.N or v0.9.NrcM)"; exit 1; }
      - name: Tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main"; exit 1; }
      - name: Changelog has the release
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%rc*}"  # a release candidate uses its release's heading
          grep -Eq "^## ${v//./\\.}( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${v}' heading"; exit 1; }
      - name: Tag matches __version__
        run: |
          version=$(python -c "import ast, pathlib; tree = ast.parse(pathlib.Path('src/implicit_geometry_kernel/__init__.py').read_text()); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and any(getattr(t, 'id', '') == '__version__' for t in n.targets)))")
          echo "tag ${GITHUB_REF_NAME}, __version__ ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    # The GitHub release for the tag: notes are the tag's CHANGELOG.md section,
    # with the sdist and wheel attached. A release candidate is a pre-release.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%rc*}"
          awk -v v="$v" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          make_latest: ${{ !contains(github.ref_name, 'rc') }}
