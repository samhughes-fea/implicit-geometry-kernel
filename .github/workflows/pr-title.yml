name: pr-title

# The PR title becomes the squash commit on main, so it must be a Conventional
# Commit (docs/conventions/COMMITS.md).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            sdf
            section
            blade
            structure
            mesh
            docs-site
            examples
            release
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "Start the summary with a lower-case letter (the subject was \"{subject}\")."
