[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "implicit-geometry-kernel"
dynamic = ["version"]
description = "Implicit (signed-distance) geometry of blade and wing sections: 40 structural layouts, wall midlines and cell loops, lofted along the span."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Hughes" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.22", "numba>=0.59"]
keywords = ["wind turbine blade", "wing", "cross-section", "signed distance function", "CSG", "geometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
splines = ["scipy>=1.8"]
plots = ["matplotlib>=3.5"]
cad = ["cadquery>=2.4"]
contours = ["contourpy"]
dev = ["scipy>=1.8", "matplotlib>=3.5", "pytest>=7", "build>=1.0", "ruff>=0.6", "mypy>=1.10", "contourpy", "pyyaml>=6"]
reference = ["pyyaml>=6"]
mesh = ["gmsh"]
docs = ["sphinx>=7", "myst-parser>=3", "sphinxcontrib-mermaid>=0.9"]

[project.urls]
Homepage = "https://github.com/samhughes-fea/implicit-geometry-kernel"
Source = "https://github.com/samhughes-fea/implicit-geometry-kernel"
Issues = "https://github.com/samhughes-fea/implicit-geometry-kernel/issues"

[tool.setuptools.dynamic]
version = { attr = "implicit_geometry_kernel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["implicit_geometry_kernel*"]
exclude = ["tests*", "examples*", "docs*", "scripts*", "reference_blades*"]


[tool.pytest.ini_options]
# test files in different folders share names (test_import_boundary.py, ...), so
# modules are imported by path
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "frame_comparison: coordinate-frame convention checks from the forked geometry",
    "reference: needs the private reference-blades catalogue cloned beside the kernel",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
files = ["src/implicit_geometry_kernel"]
exclude = ["implicit_geometry_kernel/plotting"]

# Mixins are copied onto BladeGeometry / SectionGeometry; self is that host.
[[tool.mypy.overrides]]
module = [
    "implicit_geometry_kernel.blade.loft.loft_cut",
    "implicit_geometry_kernel.blade.loft.loft_fields",
    "implicit_geometry_kernel.blade.loft.loft_layout",
    "implicit_geometry_kernel.section.spec.runner_lifecycle",
]
disable_error_code = ["misc", "attr-defined", "return-value", "has-type"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# syntax errors and pyflakes only; the forked code is not formatted to one style
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841"]
"examples/**" = ["F841", "E402"]
"scripts/**" = ["E402"]
